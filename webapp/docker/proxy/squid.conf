# Generated allowlist lives in /etc/squid/allowlist.txt (see entry.sh).
# Logs go to files (squid drops to the unprivileged "squid" user and then
# cannot open /dev/stdout); entry.sh streams access.log to the container log.
http_port 3128
acl allowed dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
# Generated by entry.sh: a single host:port rule for a local (plain-HTTP)
# test Supabase, e.g. host.docker.internal:54321. Empty otherwise.
include /etc/squid/extra.conf
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed
http_access deny all
cache deny all
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename none
coredump_dir /tmp
shutdown_lifetime 1 seconds
