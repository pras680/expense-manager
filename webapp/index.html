<!doctype html>
<html lang="en" data-theme="midnight" data-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0c10" />
    <!-- Applies the stored theme before the first paint, so the page never
         flashes the default theme on the way to the chosen one. The key and
         the light-theme list mirror src/lib/theme.ts; an unknown value just
         leaves the default attributes above in place. -->
    <script>
      try {
        var t = localStorage.getItem('billskills.theme')
        if (t && /^(midnight|ember|ocean|orchid|paper|sorbet)$/.test(t)) {
          document.documentElement.dataset.theme = t
          document.documentElement.dataset.scheme = t === 'paper' || t === 'sorbet' ? 'light' : 'dark'
        }
      } catch (e) {}
    </script>
    <!-- Space Grotesk for headings and figures, Inter for everything else
         (see the font tokens in src/index.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Bill Skills</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
